# -----------------------------------------------
# .github/auto_assign.yml
# PR 오픈 시 자동으로 Assignee와 Reviewer를 지정합니다.
# kentaro-m/auto-assign-action@v2 문법 기준
# -----------------------------------------------

# Assignee를 PR 작성자 본인으로 자동 지정
addAssignees: author

# 리뷰어 자동 지정
addReviewers: true
skipDraft: false

# 리뷰어 풀 (GitHub username으로 작성)
reviewers:
  - wkdrudgnsdla
  - movingfrog
  - suti1110
  - leesiuuuu
  - bluemoon983

filterReviewers: true  # 이 줄 추가

# 전체 리뷰어 중 랜덤으로 지정할 인원 수
# 0이면 전원 지정
numberOfReviewers: 0


# 특정 라벨이 달린 PR은 리뷰어 지정 스킵
# skipKeywords:
#   - wip
#   - draft
